services:
  postgres:
    image: postgres:17
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: stockflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockflow_postgres_data:/var/lib/postgresql/data

volumes:
  stockflow_postgres_data: